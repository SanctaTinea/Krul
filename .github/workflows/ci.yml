name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Python GUI/requirements-dev.txt"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -r "Python GUI/requirements-dev.txt"
      - name: Test Starset
        run: |
            mkdir -p build
            python -m pytest -q "Python GUI/tests" --basetemp=build/pytest-ci
